
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="fonts/fontawesome/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="css/theme.css">
</head>
<body>
    <div class="form-body">
        <div class="website-logo">
            <a href="index.html">
                <div class="logo">
                    <img class="logo-size" src="images/logo-dark.svg" alt="">
                </div>
            </a>
        </div>
        <div class="row">
            <div class="img-holder">
                <div class="bg"></div>
                <div class="info-holder">

                </div>
            </div>
            <div class="form-holder">
                <div class="form-content">
                    <div class="form-items">
                        <h3>Create an Account</h3>
                        <p>Lorem ipsum dolor sit amet consectetur elit tempus mattis diam, vel ultrices lorem.</p>
                        <div class="page-links">
                            <a href="index.html">Login</a><a href="register3.html" class="active">Signup</a>
                        </div>
                        <form>
                            <label for="name" class="d-none">Name</label>
                            <input class="form-control" type="text" name="name" id="name" placeholder="Full Name" required>

                            <label for="emailid" class="d-none">Email Id</label>
                            <input class="form-control" type="email" name="email" id="emailid" placeholder="E-mail Address" required>

                            <label for="password" class="d-none">Password</label>
                            <input class="form-control" type="password" name="password" id="password" placeholder="Password" required>
                            <div class="form-button">
                                <button id="submit" type="submit" class="ibtn">Signup</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script src="js/jquery.min.js"></script>
<script src="js/popper.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
